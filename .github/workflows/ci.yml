name: ci
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o fleet${{ matrix.os == 'windows-latest' && '.exe' || '' }} ./cmd/fleet
      - name: selfcheck
        shell: bash
        run: ./fleet${{ matrix.os == 'windows-latest' && '.exe' || '' }} test selfcheck
